services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kolapse
      POSTGRES_USER: kolapse
      POSTGRES_PASSWORD: kolapse
    volumes:
      - kolapse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolapse -d kolapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://kolapse:kolapse@db:5432/kolapse
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  kolapse_postgres:
